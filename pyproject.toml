[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscan-cli"
version = "1.1.0"
description = "Deterministic security scanner for AI agent skills + Trusted Distribution CLI. Local, zero-dependency, executes nothing. Facts, not verdicts."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "baldbee" }]
keywords = ["security", "ai", "agent", "skills", "llm", "scanner", "mcp", "claude-code", "cursor", "codex", "supply-chain", "distribution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thesfb/scanaskill"
Repository = "https://github.com/thesfb/scanaskill"

[project.scripts]
agentscan = "agentscan.cli:run"
scanaskill = "scanaskill.cli:run"  # backward-compatible alias

[tool.setuptools]
packages = ["agentscan", "scanaskill", "scanaskill.analysis", "scanaskill.checks"]
